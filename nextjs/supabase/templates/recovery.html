<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset your password</title>
  </head>
  <body style="margin:0; padding:0; background-color:#faf8f5; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#faf8f5; padding:48px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" style="max-width:480px;" cellpadding="0" cellspacing="0">
            <tr>
              <td align="center" style="padding-bottom:40px;">
                <span style="font-family:Georgia,'Times New Roman',serif; font-style:italic; font-size:22px; color:#111111; text-transform:lowercase; letter-spacing:0.02em;">yoga with lisa rose</span>
              </td>
            </tr>
            <tr>
              <td style="background-color:#ffffff; border-radius:20px; padding:48px 40px;">
                <h1 style="margin:0 0 20px; font-family:Georgia,'Times New Roman',serif; font-weight:500; font-size:28px; line-height:1.3; color:#111111;">
                  Reset your <em style="font-style:italic;">password</em>
                </h1>
                <p style="margin:0 0 32px; font-size:15px; line-height:1.7; color:rgba(17,17,17,0.62);">
                  We received a request to reset the password for {{ .Email }}. Click below to choose a new one.
                </p>
                <table role="presentation" cellpadding="0" cellspacing="0">
                  <tr>
                    <td style="border-radius:999px; background-color:#1a1a1a;">
                      <a href="{{ .ConfirmationURL }}" style="display:inline-block; padding:14px 32px; font-size:13px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:#ffffff; text-decoration:none;">
                        Reset password
                      </a>
                    </td>
                  </tr>
                </table>
                <p style="margin:32px 0 0; font-size:13px; line-height:1.6; color:rgba(17,17,17,0.45);">
                  If you didn't request this, you can safely ignore this email — your password won't change.
                </p>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding-top:32px;">
                <p style="margin:0; font-size:12px; color:rgba(17,17,17,0.4);">&copy; Yoga with Lisa. All rights reserved.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
